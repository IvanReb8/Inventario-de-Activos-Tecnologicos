# Nombre de la aplicación Spring Boot
spring.application.name=products

# Configuración del servidor embebido
server.port=8080
server.servlet.context-path=/

# Configuración de la fuente de datos (MariaDB)
spring.datasource.url=jdbc:mariadb://localhost:3307/catalog_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# Ver logs SQL durante el desarrollo
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración del pool HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# Modo del banner de Spring Boot
spring.main.banner-mode=console
